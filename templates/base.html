{% load static %}
<!doctype html>
<html lang="en" data-theme="{{ settings.theme|default:'dark' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#18181b">
    <title>{% block title %}FlashCram{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/katex/katex.min.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/mathlive/mathlive-static.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/mathlive/mathlive-fonts.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/pygments/light.css' %}">
    <link rel="stylesheet" href="{% static 'vendor/pygments/dark.css' %}">
    <link rel="manifest" href="{% static 'manifest.webmanifest' %}">
    <link rel="icon" href="{% static 'icons/favicon.png' %}" type="image/png">
    <style>
      [x-cloak] { display: none !important; }
      html[data-theme="dark"] { --fc-page: #111116; --fc-text: #f5f7fb; }
      html[data-theme="light"] { --fc-page: #f8fafc; --fc-text: #0f172a; }
      html, body { margin: 0; min-height: 100%; background: var(--fc-page, #111116); color: var(--fc-text, #f5f7fb); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      a { color: inherit; }
    </style>
    <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
    <script defer src="{% static 'js/card-editor.js' %}"></script>
    <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
    <script defer src="{% static 'vendor/katex/katex.min.js' %}"></script>
    <script defer src="{% static 'vendor/katex/auto-render.min.js' %}"></script>
    <script type="module" src="{% static 'vendor/mathlive/mathlive.min.mjs' %}"></script>
    <script>
      window.flashcramFitMath = function(root) {
        const scope = root || document;
        const mathRoots = new Set();
        if (scope.matches && scope.matches('[data-render-math="true"]')) {
          mathRoots.add(scope);
        }
        if (scope.querySelectorAll) {
          scope.querySelectorAll('[data-render-math="true"]').forEach(function(target) {
            mathRoots.add(target);
          });
        }

        mathRoots.forEach(function(mathRoot) {
          mathRoot.querySelectorAll('.katex').forEach(function(katex) {
            if (katex.closest('.katex-display') || katex.parentElement?.classList.contains('fc-math-inline-frame')) {
              return;
            }
            const frame = document.createElement('span');
            frame.className = 'fc-math-inline-frame';
            katex.parentNode.insertBefore(frame, katex);
            frame.appendChild(katex);
          });

          const targets = [];
          mathRoot.querySelectorAll('.katex-display').forEach(function(display) {
            const subject = display.querySelector('.katex');
            if (subject) {
              targets.push({ frame: display, subject: subject, inline: false });
            }
          });
          mathRoot.querySelectorAll('.fc-math-inline-frame').forEach(function(frame) {
            const subject = frame.querySelector('.katex');
            if (subject) {
              targets.push({ frame: frame, subject: subject, inline: true });
            }
          });

          targets.forEach(function(item) {
            const frame = item.frame;
            const subject = item.subject;
            const container = frame.closest('.fc-rendered-content') || frame.parentElement || mathRoot;
            const available = Math.floor(container.clientWidth || container.getBoundingClientRect().width || 0);
            if (available <= 1 || frame.getClientRects().length === 0 || subject.getClientRects().length === 0) {
              return;
            }
            const mobile = window.matchMedia('(max-width: 639px)').matches;
            const minScale = mobile ? 0.62 : 0.75;

            frame.classList.toggle('fc-math-display-frame', !item.inline);
            frame.classList.toggle('fc-math-inline-frame', item.inline);
            frame.classList.remove('fc-math-contained');
            subject.classList.remove('fc-math-fit-subject');
            subject.style.removeProperty('--fc-math-scale');
            subject.style.removeProperty('transform');
            frame.style.removeProperty('height');
            frame.style.removeProperty('width');

            const htmlSubject = subject.querySelector('.katex-html');
            const subjectRect = subject.getBoundingClientRect();
            const htmlRect = htmlSubject ? htmlSubject.getBoundingClientRect() : { width: 0, height: 0 };
            const naturalWidth = Math.max(
              subject.scrollWidth,
              subjectRect.width,
              htmlSubject ? htmlSubject.scrollWidth : 0,
              htmlRect.width
            );
            const naturalHeight = Math.max(
              subject.scrollHeight,
              subjectRect.height,
              htmlSubject ? htmlSubject.scrollHeight : 0,
              htmlRect.height
            );
            if (!naturalWidth || naturalWidth <= available) {
              return;
            }

            let scale = available / naturalWidth;
            const needsContainment = scale < minScale;
            if (needsContainment) {
              scale = minScale;
              frame.classList.add('fc-math-contained');
            }

            subject.classList.add('fc-math-fit-subject');
            subject.style.setProperty('--fc-math-scale', scale.toFixed(4));
            frame.style.height = `${Math.ceil(naturalHeight * scale)}px`;
            if (item.inline) {
              frame.style.width = `${Math.min(Math.ceil(naturalWidth * scale), available)}px`;
            }
          });
        });
      };

      window.flashcramFitReviewText = function(root) {
        const scope = root || document;
        const contents = new Set();
        if (scope.matches && scope.matches('#review-panel .fc-review-content')) {
          contents.add(scope);
        }
        if (scope.querySelectorAll) {
          scope.querySelectorAll('#review-panel .fc-review-content').forEach(function(content) {
            contents.add(content);
          });
        }

        contents.forEach(function(content) {
          const faces = Array.from(content.querySelectorAll('.fc-review-face'));
          faces.forEach(function(face) {
            face.style.removeProperty('--fc-review-text-scale');
            face.style.removeProperty('--fc-review-reserved-height');
            face.classList.remove('fc-review-face-fit');
          });

          const visibleFace = faces.find(function(face) {
            return face.getClientRects().length > 0 && window.getComputedStyle(face).display !== 'none';
          });
          if (!visibleFace) return;

          const inner = visibleFace.querySelector('.fc-review-face-inner');
          if (!inner) return;

          const available = Math.floor(content.clientHeight || content.getBoundingClientRect().height || 0);
          if (available <= 1) return;

          const naturalHeight = Math.ceil(Math.max(inner.scrollHeight, inner.getBoundingClientRect().height));
          if (!naturalHeight || naturalHeight <= available) return;

          const minScale = 0.8;
          const scale = Math.max(minScale, available / naturalHeight);
          const scaledHeight = Math.ceil(naturalHeight * scale);
          if (scaledHeight > available) return;

          visibleFace.classList.add('fc-review-face-fit');
          visibleFace.style.setProperty('--fc-review-text-scale', scale.toFixed(4));
          visibleFace.style.setProperty('--fc-review-reserved-height', `${scaledHeight}px`);
        });
      };

      window.flashcramRenderMath = function(root) {
        if (!window.renderMathInElement) return;
        const scope = root || document;
        const targets = new Set();
        if (scope.matches && scope.matches('[data-render-math="true"]')) {
          targets.add(scope);
        }
        if (scope.querySelectorAll) {
          scope.querySelectorAll('[data-render-math="true"]').forEach(function(target) {
            targets.add(target);
          });
        }
        targets.forEach(function(target) {
          window.renderMathInElement(target, {
          delimiters: [
            {left: "\\(", right: "\\)", display: false},
            {left: "\\[", right: "\\]", display: true},
            {left: "$$", right: "$$", display: true}
          ],
          throwOnError: false
          });
        });
        window.requestAnimationFrame(function() {
          window.flashcramFitMath(scope);
          window.flashcramFitReviewText(scope);
        });
      };
      let flashcramMathFitFrame = null;
      window.flashcramRefitMath = function() {
        if (flashcramMathFitFrame) {
          window.cancelAnimationFrame(flashcramMathFitFrame);
        }
        flashcramMathFitFrame = window.requestAnimationFrame(function() {
          window.flashcramFitMath(document);
          window.flashcramFitReviewText(document);
        });
      };
      document.addEventListener("DOMContentLoaded", function() {
        window.flashcramRenderMath(document);
      });
      document.addEventListener("htmx:afterSwap", function(event) {
        window.flashcramRenderMath(event.target);
      });
      window.addEventListener("resize", window.flashcramRefitMath);
      window.addEventListener("orientationchange", window.flashcramRefitMath);
    </script>
  </head>
  <body class="min-h-screen bg-base-300 text-base-content antialiased" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <header class="sticky top-0 z-40 border-b border-base-content/10 bg-base-300/90 backdrop-blur-xl">
      <nav class="mx-auto flex h-16 w-full max-w-5xl items-center justify-between gap-3 px-4">
        <a class="flex min-w-0 items-center gap-2" href="{% url 'cards:home' %}" aria-label="FlashCram decks">
          <img class="h-9 w-9 rounded-xl shadow-lg shadow-primary/20" src="{% static 'icons/favicon.png' %}" alt="">
          <span class="fc-brand-text truncate text-lg font-black tracking-tight">FlashCram</span>
        </a>
        <div class="hidden items-center gap-2 md:flex">
          <a class="btn btn-ghost btn-sm" href="{% url 'cards:home' %}">Decks</a>
          <a class="btn btn-ghost btn-sm" href="{% url 'cards:marked_cards' %}">Marked</a>
          <a class="btn btn-ghost btn-sm" href="{% url 'cards:bulk_import' %}">Import</a>
          <a class="btn btn-ghost btn-sm" href="{% url 'cards:settings' %}">Settings</a>
        </div>
        <div class="relative md:hidden" x-data="{ open: false }">
          <button class="btn btn-ghost btn-square rounded-2xl" type="button" aria-label="Open navigation menu" :aria-expanded="open.toString()" @click="open = !open" @keydown.escape.window="open = false">
            <span class="flex h-5 w-5 flex-col justify-center gap-1">
              <span class="block h-0.5 rounded-full bg-current"></span>
              <span class="block h-0.5 rounded-full bg-current"></span>
              <span class="block h-0.5 rounded-full bg-current"></span>
            </span>
          </button>
          <div class="fc-card absolute right-0 top-full z-50 mt-2 w-52 rounded-3xl p-2 shadow-xl" x-cloak x-show="open" x-transition @click.outside="open = false">
            <a class="btn btn-ghost fc-tap w-full justify-start rounded-2xl" href="{% url 'cards:home' %}">Decks</a>
            <a class="btn btn-ghost fc-tap w-full justify-start rounded-2xl" href="{% url 'cards:marked_cards' %}">Marked</a>
            <a class="btn btn-ghost fc-tap w-full justify-start rounded-2xl" href="{% url 'cards:bulk_import' %}">Import</a>
            <a class="btn btn-ghost fc-tap w-full justify-start rounded-2xl" href="{% url 'cards:settings' %}">Settings</a>
          </div>
        </div>
      </nav>
    </header>
    <main class="fc-shell mx-auto flex w-full max-w-5xl flex-col px-4 py-5 sm:px-6 md:py-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
