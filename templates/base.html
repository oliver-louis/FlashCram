{% load static %}
<!doctype html>
<html lang="en" data-theme="{{ settings.theme|default:'dark' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FlashCram{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    <style>[x-cloak] { display: none !important; }</style>
    <script defer src="{% static 'vendor/htmx.min.js' %}"></script>
    <script defer src="{% static 'vendor/alpine.min.js' %}"></script>
  </head>
  <body class="min-h-screen bg-base-200 text-base-content" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
    <main class="mx-auto flex min-h-screen w-full max-w-3xl flex-col px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
