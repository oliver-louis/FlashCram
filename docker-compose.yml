services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "0.0.0.0:${HOST_PORT:-8000}:8000"
    environment:
      DEBUG: "${DEBUG:-False}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me-for-your-homelab}"
      ALLOWED_HOSTS: "${ALLOWED_HOSTS:-*}"
      CSRF_TRUSTED_ORIGINS: "${CSRF_TRUSTED_ORIGINS:-}"
      DATABASE_URL: "${DATABASE_URL:-sqlite:////data/flashcram.sqlite3}"
      USE_X_FORWARDED_HOST: "${USE_X_FORWARDED_HOST:-False}"
      SECURE_PROXY_SSL_HEADER: "${SECURE_PROXY_SSL_HEADER:-False}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-False}"
      CSRF_COOKIE_SECURE: "${CSRF_COOKIE_SECURE:-False}"
      SECURE_SSL_REDIRECT: "${SECURE_SSL_REDIRECT:-False}"
    volumes:
      - flashcram-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Future Postgres option only. Do not enable during MVP SQLite phases.
  # postgres:
  #   image: postgres:17-alpine
  #   profiles: ["postgres"]
  #   environment:
  #     POSTGRES_DB: flashcram
  #     POSTGRES_USER: flashcram
  #     POSTGRES_PASSWORD: flashcram
  #   volumes:
  #     - flashcram-postgres:/var/lib/postgresql/data

volumes:
  flashcram-data:
  # flashcram-postgres:
