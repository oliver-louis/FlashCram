services:
  app:
    build: .
    ports:
      - "${HOST_PORT:-8000}:8000"
    environment:
      DEBUG: "False"
      DJANGO_SECRET_KEY: "change-me-for-your-homelab"
      ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      DATABASE_URL: "sqlite:////data/flashcram.sqlite3"
    volumes:
      - flashcram-data:/data

  # Future Postgres option only. Do not enable during MVP SQLite phases.
  # postgres:
