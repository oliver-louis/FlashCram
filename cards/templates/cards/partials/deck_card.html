<article id="deck-{{ deck.id }}" class="rounded-lg bg-base-100 p-4 shadow-sm">
  <a class="block" href="{% url 'cards:deck_detail' deck.id %}">
    <div class="flex items-start justify-between gap-3">
      <div>
        <h2 class="text-xl font-bold">{{ deck.name }}</h2>
        {% if deck.description %}
          <p class="mt-1 line-clamp-2 text-sm text-base-content/70">{{ deck.description }}</p>
        {% endif %}
      </div>
      <span class="badge badge-primary">{{ deck.card_count }}</span>
    </div>
    <div class="mt-4 grid grid-cols-3 gap-2 text-center text-sm">
      <div class="rounded bg-base-200 p-2"><strong>{{ deck.unseen_count }}</strong><br>unseen</div>
      <div class="rounded bg-base-200 p-2"><strong>{{ deck.weak_count }}</strong><br>weak</div>
      <div class="rounded bg-base-200 p-2"><strong>{{ deck.hidden_count }}</strong><br>hidden</div>
    </div>
  </a>
</article>
