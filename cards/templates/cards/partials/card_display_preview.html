<div
  id="card-preview-modal"
  class="fixed inset-0 z-50 grid place-items-center bg-black/75 p-4"
  x-data="{
    open: true,
    revealed: false,
    refitMath() {
      this.$nextTick(() => window.requestAnimationFrame(() => window.flashcramFitMath?.(this.$root)));
    },
    toggleReveal() {
      this.revealed = !this.revealed;
      this.refitMath();
    }
  }"
  x-init="refitMath()"
  x-show="open"
  x-transition
  @click.self="open = false"
  @keydown.escape.window="open = false"
>
  <section class="flex max-h-[92vh] w-full max-w-2xl flex-col gap-3">
    <div class="fc-glass flex items-center justify-between gap-3 rounded-3xl p-3">
      <div class="min-w-0">
        <p class="truncate text-sm fc-muted">{{ deck.name }}</p>
        <h2 class="truncate text-lg font-black">Card preview</h2>
      </div>
      <button class="btn btn-ghost btn-sm rounded-2xl" type="button" @click="open = false">Close</button>
    </div>

    <div
      role="button"
      tabindex="0"
      class="fc-review-card flex min-h-[24rem] flex-col rounded-3xl p-6 text-left transition active:scale-[0.99]"
      @click="toggleReveal()"
      @keydown.enter.prevent="toggleReveal()"
      @keydown.space.prevent="toggleReveal()"
    >
      <div class="flex items-center justify-between gap-3">
        <p class="text-sm font-semibold uppercase tracking-[0.18em] text-primary" x-text="revealed ? 'Back' : 'Front'"></p>
        <div class="flex items-center gap-2">
          {% if card.is_marked %}
            <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-secondary text-sm font-black text-secondary-content shadow-sm shadow-secondary/30" aria-label="Marked card" title="Marked card">
              <span aria-hidden="true">★</span>
            </span>
          {% endif %}
          <span class="badge badge-outline min-w-14 rounded-xl text-center" x-text="revealed ? 'Back' : 'Flip'" :aria-label="revealed ? 'Tap card to flip back to the front' : 'Tap card to reveal the back'" :title="revealed ? 'Tap card to flip back' : 'Tap card to reveal'">Flip</span>
        </div>
      </div>
      <div class="mt-8 flex flex-1 flex-col justify-center overflow-y-auto text-2xl leading-tight sm:text-3xl" x-show="!revealed">
        {% with rendered_face=rendered_front %}
          {% include "cards/partials/rendered_face.html" %}
        {% endwith %}
      </div>
      <div class="mt-8 flex flex-1 flex-col justify-center overflow-y-auto text-2xl leading-tight sm:text-3xl" x-cloak x-show="revealed">
        {% with rendered_face=rendered_back %}
          {% include "cards/partials/rendered_face.html" %}
        {% endwith %}
      </div>
    </div>
  </section>
</div>
