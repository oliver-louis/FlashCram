<section id="review-panel" class="flex min-h-[calc(100vh-7rem)] flex-col justify-center gap-6 text-center">
  <div class="fc-card mx-auto max-w-md rounded-3xl p-6">
    <p class="text-sm font-semibold uppercase tracking-[0.18em] text-primary">{{ deck.name }}</p>
    <h1 class="mt-2 text-3xl font-black">Nothing to review</h1>
    <p class="mt-3 fc-muted">{{ empty_mode_label }} has no eligible cards right now.</p>
  </div>
  <div class="grid gap-3 sm:grid-cols-2">
    <a class="btn btn-primary btn-lg fc-tap rounded-2xl" href="{% url 'cards:deck_detail' deck.id %}">Back to deck</a>
    <a class="btn btn-outline btn-lg fc-tap rounded-2xl" href="{% url 'cards:card_create' deck.id %}">Add card</a>
  </div>
</section>
