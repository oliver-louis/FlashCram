<section {% if deck %}id="deck-header"{% endif %} class="fc-card rounded-3xl p-5">
  <h2 class="mb-4 text-2xl font-black">{{ title }}</h2>
  <form method="post" action="{{ action_url }}" hx-post="{{ action_url }}" hx-target="{% if deck %}#deck-header{% else %}#deck-list{% endif %}" hx-swap="{% if deck %}outerHTML{% else %}afterbegin{% endif %}" class="space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}
    <label class="form-control">
      <span class="label-text">Name</span>
      {{ form.name }}
      {{ form.name.errors }}
    </label>
    <label class="form-control">
      <span class="label-text">Description</span>
      {{ form.description }}
      {{ form.description.errors }}
    </label>
    <div class="grid grid-cols-2 gap-3 sm:flex">
      <button class="btn btn-primary fc-tap rounded-2xl" type="submit">{{ submit_label }}</button>
      <a class="btn btn-ghost fc-tap rounded-2xl" href="{% if deck %}{% url 'cards:deck_detail' deck.id %}{% else %}{% url 'cards:home' %}{% endif %}">Cancel</a>
    </div>
  </form>
</section>
