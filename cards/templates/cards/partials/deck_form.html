<section class="rounded-lg bg-base-100 p-4 shadow-sm">
  <h2 class="mb-4 text-xl font-bold">{{ title }}</h2>
  <form method="post" action="{{ action_url }}" hx-post="{{ action_url }}" hx-target="{% if deck %}#deck-header{% else %}#deck-list{% endif %}" hx-swap="{% if deck %}outerHTML{% else %}afterbegin{% endif %}" class="space-y-4">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <div class="alert alert-error">{{ form.non_field_errors }}</div>
    {% endif %}
    <label class="form-control">
      <span class="label-text">Name</span>
      {{ form.name }}
      {{ form.name.errors }}
    </label>
    <label class="form-control">
      <span class="label-text">Description</span>
      {{ form.description }}
      {{ form.description.errors }}
    </label>
    <div class="flex gap-2">
      <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
      <a class="btn btn-ghost" href="{% if deck %}{% url 'cards:deck_detail' deck.id %}{% else %}{% url 'cards:home' %}{% endif %}">Cancel</a>
    </div>
  </form>
</section>
