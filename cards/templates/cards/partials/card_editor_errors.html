{% if form.errors %}
<div class="alert alert-error mb-4 block" role="alert"><p class="font-semibold">Please check the following:</p><ul>
{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}" data-error-field="{{ field.name }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}
{% for error in form.non_field_errors %}<li>{{ error }}</li>{% endfor %}
</ul></div>
{% endif %}
