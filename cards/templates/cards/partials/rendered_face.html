<div class="fc-rendered-content prose max-w-none" data-rendered-content{% if rendered_face.enable_math %} data-render-math="true"{% endif %}>
  {{ rendered_face.html }}
</div>
{% if rendered_face.image_data_uri %}
  <div class="mt-5" x-data="{ zoomed: false }">
    <button class="block w-full" type="button" @click.stop="zoomed = true" aria-label="Open card image">
      <img class="mx-auto max-h-[45vh] w-full rounded-2xl object-contain" src="{{ rendered_face.image_data_uri }}" alt="{{ rendered_face.image_alt }}">
    </button>
    <div data-image-zoom class="fixed inset-0 z-50 grid place-items-center bg-black/85 p-4" x-cloak x-show="zoomed" @click.stop="zoomed = false" @keydown.escape.window="if (zoomed) { $event.preventDefault(); zoomed = false; }">
      <img class="max-h-[90vh] max-w-full rounded-2xl object-contain" src="{{ rendered_face.image_data_uri }}" alt="{{ rendered_face.image_alt }}">
    </div>
  </div>
{% endif %}
