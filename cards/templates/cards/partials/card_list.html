<div id="card-list" class="grid gap-3">
  {% for card in cards %}
    {% include "cards/partials/card_row.html" %}
  {% empty %}
    <div id="{% if is_filtered %}no-matching-cards{% else %}empty-card-list{% endif %}" class="rounded-lg border border-dashed border-base-300 bg-base-100 p-6 text-center">
      {% if is_filtered %}
        <h3 class="text-lg font-semibold">No matching cards</h3>
        <p class="mt-2 text-base-content/70">Try a different search or tag filter.</p>
      {% else %}
        <h3 class="text-lg font-semibold">No cards yet</h3>
        <p class="mt-2 text-base-content/70">Add a front and back to make this deck reviewable.</p>
      {% endif %}
    </div>
  {% endfor %}
</div>
